<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الدرس الأول</title>
  <style>
    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: 'Tajawal', system-ui, sans-serif;
      padding: 40px;
      text-align: center;
      margin: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h1 { color: #38bdf8; margin-bottom: 20px; }
    p { color: #94a3b8; line-height: 1.8; font-size: 16px; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>لا يتوفر بيانات الدرس حالياً</h2>
    <center>سيتم البدء قريباً بعرض الدورس والدورات التدريبية @ Rako</center>
  </div>
</body>
</html>
